services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aatmoday
      POSTGRES_USER: aatmoday
      POSTGRES_PASSWORD: aatmoday
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: